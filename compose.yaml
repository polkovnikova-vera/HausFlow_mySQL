services:
  db:
    image: mysql:8.4
    container_name: hausverwaltung-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:3308:3306"

    environment:
      MYSQL_DATABASE: hv
      MYSQL_USER: hv_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - hausverwaltung_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hausverwaltung_data: